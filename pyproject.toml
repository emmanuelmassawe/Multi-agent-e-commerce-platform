[project]
name = "clos"
version = "0.1.0"
description = "Commerce & Logistics Operating System"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "celery>=5.4,<6",
  "google-genai>=1,<2",
  "httpx>=0.27,<1",
  "redis>=5,<7",
]

[dependency-groups]
dev = ["aiosqlite>=0.20,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/clos/apps/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["clos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["clos.domain", "clos.application"]
branch = true

