openapi: 3.1.0
info:
  title: CLOS API
  version: 0.1.0
  description: Initial contract scaffold. Expand and review each operation before implementation.
servers:
  - url: /v1
paths:
  /auth/token:
    post:
      operationId: createAccessTokens
      summary: Authenticate a user and issue access and refresh tokens
      description: tenant_slug is a login selector only; the authenticated tenant scope is taken from the issued token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_slug, email, password]
              properties:
                tenant_slug: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      operationId: refreshAccessTokens
      summary: Rotate a refresh token and issue a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Refresh token rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user's tenant-scoped profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /integration-api-keys:
    post:
      operationId: createIntegrationApiKey
      summary: Create a tenant-scoped API key; the secret is returned once
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, permissions]
              properties:
                label: { type: string, minLength: 1, maxLength: 120 }
                permissions:
                  type: array
                  items: { type: string }
                expires_at: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integration-api-keys/{key_id}:
    delete:
      operationId: revokeIntegrationApiKey
      summary: Revoke an integration API key in the caller's tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Key revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /approvals:
    get:
      operationId: listApprovalRequests
      summary: List approval requests in the authenticated tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: [string, 'null'], format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: Tenant-scoped approval requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /approvals/{approval_id}/approve:
    post:
      operationId: approveRequest
      summary: Approve a pending high-risk agent action
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approval recorded and run queued to resume
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /approvals/{approval_id}/reject:
    post:
      operationId: rejectRequest
      summary: Reject a pending high-risk agent action
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rejection recorded and run queued to resume
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /approvals/{approval_id}:
    patch:
      operationId: modifyAndApproveRequest
      summary: Modify the proposed tool input and approve the updated action
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_input]
              properties:
                tool_input: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated action approved and run queued to resume
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process is responding
      responses:
        '200':
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: live }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the API can serve requests
      responses:
        '200':
          description: Process and configured PostgreSQL connection are ready
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ready }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or CLOS API key
  parameters:
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Unauthorized:
      description: Invalid or missing credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Caller role does not allow this operation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found in the current tenant
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Approval is already decided or expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    ApprovalRequest:
      type: object
      required: [approval_id, run_id, action, risk_level, status, context, expires_at, created_at]
      properties:
        approval_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        action: { type: string }
        risk_level: { type: string, const: write_high }
        status: { type: string, enum: [pending, approved, rejected] }
        context: { type: object, additionalProperties: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        decided_by: { type: [string, 'null'], format: uuid }
    ApprovalPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApprovalRequest' }
        next_cursor: { type: [string, 'null'], format: uuid }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: bearer }
    CurrentUser:
      type: object
      required: [user_id, tenant_id, email, role]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, manager, agent-operator, viewer] }
    CreatedApiKey:
      type: object
      required: [key_id, api_key, label, permissions]
      properties:
        key_id: { type: string, format: uuid }
        api_key: { type: string }
        label: { type: string }
        permissions:
          type: array
          items: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details, extended with stable CLOS error and trace identifiers.
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        trace_id: { type: string }
      required: [type, title, status, code, trace_id]

