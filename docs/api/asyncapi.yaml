asyncapi: 3.0.0
info:
  title: CLOS Events API
  version: 0.1.0
  description: SSE event contracts for agent runs and tenant-scoped human approvals.
servers:
  local:
    host: localhost:8000
    protocol: http
    description: Local development API
channels:
  approvalSocket:
    address: /v1/approvals/ws
    description: Read-only approvals inbox. Authenticate with a bearer header and optionally resume with Last-Event-ID.
    messages:
      approvalEvent: { $ref: '#/components/messages/ApprovalEvent' }
      heartbeat:
        payload:
          type: object
          required: [type]
          properties: { type: { type: string, const: heartbeat } }
  outboundWebhook:
    address: null
    description: Tenant-configured HTTPS receiver. Verify X-CLOS-Signature over timestamp, event ID and raw bytes separated by dots. Deduplicate by event ID.
    messages:
      notification:
        payload:
          type: object
          required: [event_id, event_type, tenant_id, subject_id]
          properties:
            event_id: { type: string, format: uuid }
            event_type: { type: string }
            tenant_id: { type: string, format: uuid }
            subject_id: { type: string, format: uuid }
  runEvents:
    address: /v1/runs/{run_id}/events
    parameters:
      run_id:
        description: UUIDv7 identifier for the agent run.
    messages:
      runEvent:
        $ref: '#/components/messages/RunEvent'
  approvalEvents:
    address: /v1/approvals/events
    messages:
      approvalEvent:
        $ref: '#/components/messages/ApprovalEvent'
operations:
  watchApprovals:
    action: receive
    channel: { $ref: '#/channels/approvalSocket' }
  deliverNotification:
    action: send
    channel: { $ref: '#/channels/outboundWebhook' }
  streamRunEvents:
    action: receive
    channel: { $ref: '#/channels/runEvents' }
    messages:
      - $ref: '#/channels/runEvents/messages/runEvent'
  streamApprovalEvents:
    action: receive
    channel: { $ref: '#/channels/approvalEvents' }
    messages:
      - $ref: '#/channels/approvalEvents/messages/approvalEvent'
components:
  messages:
    RunEvent:
      name: RunEvent
      contentType: application/json
      payload:
        $ref: '#/components/schemas/RunEvent'
    ApprovalEvent:
      name: ApprovalEvent
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ApprovalEvent'
  schemas:
    RunEvent:
      type: object
      required: [event_id, run_id, event_type, occurred_at]
      properties:
        event_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        event_type: { type: string, enum: [run_queued, run_started, node_started, tool_started, tool_finished, token_usage, awaiting_approval, run_finished, run_failed] }
        occurred_at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    ApprovalEvent:
      type: object
      required: [event_id, approval_id, event_type, occurred_at, data]
      properties:
        event_id: { type: string, format: uuid }
        approval_id: { type: string, format: uuid }
        event_type: { type: string, enum: [approval_requested, approval_decided, approval_expired] }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          required: [run_id, tool, status]
          properties:
            run_id: { type: string, format: uuid }
            tool: { type: string }
            status: { type: string, enum: [pending, approved, rejected] }

